# Local development infrastructure only (SRS Part J.1). The API and the three
# Vite apps run as native local processes with hot reload; only PostgreSQL and
# Redis run as containers here. Production topology is docker-compose.yml
# (added in the Deployment phase, Part J.2), which also containerizes the apps.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: commerceos
      POSTGRES_USER: commerceos
      POSTGRES_PASSWORD: commerceos
    ports:
      - "5432:5432"
    volumes:
      - commerceos_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  commerceos_pgdata_dev:
